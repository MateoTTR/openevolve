name: Fork CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        env:
          OPENAI_API_KEY: test
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check formatting (black)
        run: |
          python -m black --check openevolve tests

      - name: Check import sorting (isort)
        run: |
          python -m isort --check-only openevolve tests

      - name: Type check (mypy)
        # continue-on-error: upstream codebase has ~232 pre-existing mypy
        # errors in strict mode. We track them but do not block CI on them.
        continue-on-error: true
        run: |
          python -m mypy openevolve
